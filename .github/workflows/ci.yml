# The tests are the enforcement. A skill is guidance to the model; this is the
# gate that has to pass before a merge (TESTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxury_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luxury_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Builds the database from the migration files and runs the permission
      # suite against it.
      - run: pnpm test
